name: Update major version tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Force-update v<N> to released tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute major tag and force-update
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_USER: github-actions[bot]
          GH_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){2}(-.+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semver tag (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "::notice::Skipping major-tag update for prerelease $TAG"
            exit 0
          fi
          major="${TAG%%.*}"
          echo "Pointing $major at $TAG"
          git config user.name "$GH_USER"
          git config user.email "$GH_EMAIL"
          git tag -f -a "$major" -m "$major -> $TAG" "$TAG"
          git push --force origin "$major"
