name: Verify Release

# Re-verifies the published action end-to-end after a release is cut.
# Mirrors e2e.yml but references the action via dodi-smart/runner-fallback-action@main
# (the consumer-facing form) instead of ./ (local source), so we catch any
# dist/-vs-src mismatches between what was tested on the merge and what
# the marketplace ships.
#
# GitHub Actions does NOT allow expressions in `uses:` — the ref must be a
# literal string. We pin to @main, which after a release-merge is exactly
# the released commit. To verify a specific tag (e.g. v2.0.1), edit the
# refs in this file on a throwaway branch and dispatch from there.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  detect-self-hosted:
    name: Detect org-scoped self-hosted runners
    runs-on: ubuntu-latest
    outputs:
      use-runner: ${{ steps.detect.outputs.use-runner }}
    steps:
      - id: detect
        uses: dodi-smart/runner-fallback-action@main
        with:
          organization: 'dodi-smart'
          primary-runner: 'self-hosted,linux'
          fallback-runner: 'ubuntu-latest'
          fallback-on-error: 'true'
          github-token: ${{ secrets.TEST_GITHUB_TOKEN }}
      - name: Assert output is a non-empty JSON array
        run: |
          echo "Selected: ${{ steps.detect.outputs.use-runner }}"
          echo '${{ steps.detect.outputs.use-runner }}' | jq -e 'type == "array" and length > 0'

  detect-with-required-primaries:
    name: Detect with primaries-required threshold
    runs-on: ubuntu-latest
    steps:
      - id: detect
        uses: dodi-smart/runner-fallback-action@main
        with:
          organization: 'dodi-smart'
          primary-runner: 'self-hosted,linux'
          fallback-runner: 'ubuntu-latest'
          primaries-required: '1'
          fallback-on-error: 'true'
          github-token: ${{ secrets.TEST_GITHUB_TOKEN }}
      - name: Assert action did not fail
        run: |
          echo "Selected: ${{ steps.detect.outputs.use-runner }}"
          echo '${{ steps.detect.outputs.use-runner }}' | jq -e 'type == "array" and length > 0'

  # Forces the fallback path so the runs-on:fromJson() consumer demo always
  # lands on a GitHub-hosted runner — independent of org self-hosted policy.
  dispatch-fallback-runner:
    name: Demonstrate runs-on:fromJson() consumer pattern
    runs-on: ubuntu-latest
    outputs:
      use-runner: ${{ steps.detect.outputs.use-runner }}
    steps:
      - id: detect
        uses: dodi-smart/runner-fallback-action@main
        with:
          organization: 'dodi-smart'
          primary-runner: 'self-hosted,this-label-never-exists'
          fallback-runner: 'ubuntu-latest'
          fallback-on-error: 'true'
          github-token: ${{ secrets.TEST_GITHUB_TOKEN }}
      - name: Assert fallback was selected
        run: |
          echo "Selected: ${{ steps.detect.outputs.use-runner }}"
          echo '${{ steps.detect.outputs.use-runner }}' | jq -e '. == ["ubuntu-latest"]'

  run-on-selected-runner:
    name: Run a job on the selected runner
    needs: dispatch-fallback-runner
    if: needs.dispatch-fallback-runner.result == 'success' && needs.dispatch-fallback-runner.outputs.use-runner != ''
    runs-on: ${{ fromJson(needs.dispatch-fallback-runner.outputs.use-runner) }}
    steps:
      - name: Confirm the chosen runner picked us up
        run: |
          echo "Running on: ${{ needs.dispatch-fallback-runner.outputs.use-runner }}"
          uname -a

  fallback-on-invalid-token:
    name: Fallback when token is invalid
    runs-on: ubuntu-latest
    steps:
      - id: detect
        uses: dodi-smart/runner-fallback-action@main
        with:
          organization: 'dodi-smart'
          primary-runner: 'self-hosted,linux'
          fallback-runner: 'ubuntu-latest'
          fallback-on-error: 'true'
          github-token: 'invalid-token-on-purpose'
      - name: Assert fallback was returned
        run: |
          echo "Selected: ${{ steps.detect.outputs.use-runner }}"
          echo '${{ steps.detect.outputs.use-runner }}' | jq -e '. == ["ubuntu-latest"]'
