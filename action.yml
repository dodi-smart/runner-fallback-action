name: 'Runner Availability Checker'
description: 'Check for availability of self-hosted GitHub runners and fall back to GitHub-hosted runners if needed'
author: '@azlekov'
branding:
  icon: activity
  color: blue
inputs:
  github-token:
    description: 'GitHub token with repo and actions scope for querying runner information (org admin required for org/enterprise queries)'
    required: true
  primary-runner:
    description: 'Comma-separated list of labels for the primary runner, e.g. self-hosted,linux'
    required: true
  fallback-runner:
    description: 'Name or comma-separated labels of the fallback runner, e.g. ubuntu-latest'
    required: true
  organization:
    description: 'GitHub organization name to check for self-hosted runners (mutually exclusive with enterprise). If neither is supplied, repository-level runners are used.'
    required: false
  enterprise:
    description: 'GitHub enterprise name to check for self-hosted runners (mutually exclusive with organization). If neither is supplied, repository-level runners are used.'
    required: false
  primaries-required:
    description: 'Use the fallback runner if fewer than this many non-busy primary runners are available'
    required: false
  fallback-on-error:
    description: 'Use the fallback runner if the action encounters any error (e.g. missing or non-functional github-token)'
    required: false
    default: 'false'
outputs:
  use-runner:
    description: 'The selected runner labels as a JSON-encoded string array, ready to consume via fromJson() in runs-on'
runs:
  using: 'node24'
  main: 'dist/index.js'
